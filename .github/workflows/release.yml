name: Release CLI

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: plugins/takealot/go.mod

      - name: Test
        working-directory: plugins/takealot
        run: go test ./...

      - name: Build release assets
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          COMMIT: ${{ github.sha }}
        working-directory: plugins/takealot
        run: |
          set -euo pipefail
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must use semver form vX.Y.Z: $TAG" >&2
            exit 1
          fi

          version="${TAG#v}"
          manifest_version="$(sed -n 's/.*"version"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .codex-plugin/plugin.json | head -n 1)"
          manifest_base="${manifest_version%%+*}"
          if [[ "$manifest_base" != "$version" ]]; then
            echo "Tag version $version does not match plugin version $manifest_version" >&2
            exit 1
          fi

          mkdir -p dist
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ldflags="-s -w -X github.com/t12e/takealot-cli/internal/cli.Version=$version -X github.com/t12e/takealot-cli/internal/cli.Commit=$COMMIT -X github.com/t12e/takealot-cli/internal/cli.BuildDate=$build_date"

          while IFS=: read -r goos goarch asset; do
            CGO_ENABLED=0 GOOS="$goos" GOARCH="$goarch" go build -trimpath -ldflags="$ldflags" -o "dist/$asset" ./cmd/takealot
          done <<'TARGETS'
          linux:amd64:takealot_linux_amd64
          linux:arm64:takealot_linux_arm64
          darwin:amd64:takealot_darwin_amd64
          darwin:arm64:takealot_darwin_arm64
          windows:amd64:takealot_windows_amd64.exe
          windows:arm64:takealot_windows_arm64.exe
          TARGETS

          (cd dist && sha256sum takealot_* > checksums.txt)

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ github.ref_name }}" plugins/takealot/dist/* --title "Takealot CLI ${{ github.ref_name }}" --generate-notes
